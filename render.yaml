services:
  - type: web
    name: arohan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./arohan.db
      - key: CORS_ORIGINS
        value: https://arohan-phi.vercel.app,http://localhost:5173,http://localhost:4173
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
