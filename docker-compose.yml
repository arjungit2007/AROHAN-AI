version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: arohan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arohan_user
      POSTGRES_PASSWORD: arohan_secure_password
      POSTGRES_DB: arohan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arohan_user -d arohan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arohan_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://arohan_user:arohan_secure_password@db:5432/arohan_db
      - SECRET_KEY=arohan_production_secret_key_change_before_launch
      - AI_PROVIDER=auto
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React PWA Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: arohan_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
